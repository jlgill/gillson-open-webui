# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

logLevel: info
startPort: 11001
includeAliasesInList: true
globalTTL: 600
healthCheckTimeout: 240

models:
  gemma4-e4b:
    aliases:
      - gemma4:e4b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/gemma4-e4b/gemma-4-E4B-it-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 8192

  deepseek-r1-7b:
    aliases:
      - deepseek-r1:7b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/deepseek-r1-7b/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 16384

  deepseek-r1-14b:
    aliases:
      - deepseek-r1:14b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/deepseek-r1-14b/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 4096

  qwen2.5-coder-14b:
    aliases:
      - qwen2.5-coder:14b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen2.5-coder-14b/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 8192

  qwen3.5-9b:
    aliases:
      - qwen3.5:9b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 32768

  qwen3.5-4b:
    aliases:
      - qwen3.5:4b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 32768

  qwen3.5-2b:
    aliases:
      - qwen3.5:2b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen3.5-2b/Qwen3.5-2B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 32768

  qwen3.5-0.8b:
    aliases:
      - qwen3.5:0.8b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen3.5-0.8b/Qwen3.5-0.8B-Q4_K_M.gguf
      --n-gpu-layers 999 --ctx-size 32768

  qwen3.6-27b:
    aliases:
      - qwen3.6:27b
    cmd: >
      llama-server --host 0.0.0.0 --port ${PORT}
      --model /models/qwen3.6-27b/Qwen3.6-27B-Q3_K_S.gguf
      --mmproj /models/qwen3.6-27b/mmproj-BF16.gguf
      --no-mmproj-offload
      --n-gpu-layers 64 --ctx-size 32000
      -fa on --jinja
      --chat-template-kwargs '{"enable_thinking": false}'
      --cache-type-k q8_0 --cache-type-v q8_0
      --spec-type draft-mtp --spec-draft-n-max 2

matrix:
  vars:
    g4: gemma4-e4b
    d7: deepseek-r1-7b
    d14: deepseek-r1-14b
    qc14: qwen2.5-coder-14b
    q9: qwen3.5-9b
    q4: qwen3.5-4b
    q2: qwen3.5-2b
    q08: qwen3.5-0.8b
    q27: qwen3.6-27b

  sets:
    single: "g4 | d7 | d14 | qc14 | q9 | q4 | q2 | q08 | q27"
