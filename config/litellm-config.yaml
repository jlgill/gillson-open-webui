# =============================================================================
# LiteLLM Proxy Configuration — Open WebUI Production Gateway
# =============================================================================
# Acts as the single OpenAI-compatible endpoint for OWUI, Thoth, and other
# internal clients. Fronts Azure Foundry, OpenAI, Ollama, and llama-swap.
#
# Models are stored in the database (store_model_in_db: true) and managed
# via the LiteLLM UI at http://localhost:4000/ui — not in this file.
#
# Secrets are resolved via os.environ/* references (values supplied through
# .env -> docker compose -> container environment).
#
# Reference: https://docs.litellm.ai/docs/proxy/configs
# =============================================================================

# =============================================================================
# General settings — auth, DB persistence, UI
# =============================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Spend tracking + virtual keys disabled for now; master key only.
  # Buffer spend/usage writes in Redis and flush from a single pod-lock holder
  # instead of every worker writing to Postgres on each request.
  use_redis_transaction_buffer: true

# =============================================================================
# LiteLLM behavior — callbacks, telemetry
# =============================================================================
litellm_settings:
  drop_params: true                # strip unsupported params per-provider instead of failing
  telemetry: false                  # disable Berri telemetry
  request_timeout: 600              # seconds
  # OTEL traces -> Grafana LGTM stack (insecure gRPC, internal network)
  callbacks: ["otel"]
  # Langfuse cost correlation — works in tandem with the OWUI in-process
  #   Langfuse filter FUNCTION (config/functions/langfuse_filter.py).
  #   The custom callback (config/litellm-callbacks.py, mounted as
  #   /app/litellm_callbacks.py) reconstructs the same deterministic trace ID
  #   and appends a cost-tagged "litellm_generation" observation to the trace
  #   the filter already created.  No duplicate top-level traces.
  #
  #   Enablement and content capture follow the OWUI Function valves via the
  #   server-generated X-OpenWebUI-Langfuse header. With the filter enabled,
  #   usage/cost/TTFT flow even when content capture valves are off.
  #
  #   The NATIVE "langfuse" callback is deliberately NOT registered: it traces
  #   ALL gateway traffic (OWUI + VS Code + any client) into the proxy Langfuse
  #   project with no config-level capture controls (its mask_input/mask_output
  #   are per-request metadata steering that OWUI does not send, and the global
  #   turn_off_message_logging would also redact the correlator's input source).
  #   Gateway-wide usage/cost remains available via the LiteLLM Admin UI
  #   (http://localhost:4000/ui) and Grafana OTEL.
  #
  # Requires the updated OWUI backend header bridge and filter v1.3.1.
  # No manually configured tracing headers or pilot environment settings.
  success_callback: ["litellm_callbacks.owui_trace_correlator"]
  # Correlator also on failure_callback: failed LLM calls emit ERROR-level
  # litellm_generation observations on the OWUI trace instead of vanishing.
  failure_callback: ["otel", "litellm_callbacks.owui_trace_correlator"]
  service_callback: ["otel"]

# =============================================================================
# Router settings — shared state across the 2 uvicorn workers (--num_workers 2)
# =============================================================================
# Points at the SAME owui-redis instance Langfuse uses. Safe to share: LiteLLM
# writes only `litellm*`-prefixed keys and `litellm_proxy.*` pub/sub channels,
# Langfuse writes `bull:*` / `langfuse*` keys — no overlap on db 0.
#
# This block backs deployment cooldowns and usage/latency-based routing.
# Cross-worker coordination (rate limits, budgets, spend buffer, pod lock,
# config-change invalidation) is served by the coordination client, which
# LiteLLM builds from the REDIS_HOST/REDIS_PORT/REDIS_PASSWORD env vars
# supplied in docker-compose.prod.yaml.
#
# Response caching is deliberately NOT enabled (`litellm_settings.cache` is
# absent): owui-redis runs maxmemory-policy noeviction for Langfuse's queues,
# so cached completions could fill it and make Langfuse ingestion writes fail.
# Reference: https://docs.litellm.ai/docs/proxy/redis_requirements
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

# OTEL exporter settings consumed by LiteLLM's otel integration
# (also wired via OTEL_EXPORTER_OTLP_* env vars in compose)
environment_variables:
  OTEL_EXPORTER: "otlp_grpc"
