---
global:
  scrape_native_histograms: true
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels. This mirrors the bundled
  # grafana/otel-lgtm config and adds explicit scrape jobs below.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias

storage:
  tsdb:
    # A 10min time window is enough because it can absorb retries and network delays.
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          stack: open-webui
          service: postgres
          postgres_instance: owui-postgres