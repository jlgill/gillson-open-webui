# ===========================================
# Image Version Pinning
# ===========================================
# When upgrading, update the tags below and test thoroughly.
# Check for new versions at:
#   postgres:        https://hub.docker.com/_/postgres/tags
#   ollama:          https://hub.docker.com/ollama/ollama/tags
#   llama-swap:      https://github.com/mostlygeek/llama-swap/pkgs/container/llama-swap
#   open-webui:      https://github.com/jlgill/gillson-open-webui/pkgs/container/gillson-open-webui
#   open-terminal:   https://github.com/open-webui/open-terminal/pkgs/container/open-terminal
#   cloudflared:     https://hub.docker.com/r/cloudflare/cloudflared/tags
#   grafana-lgtm:    https://hub.docker.com/r/grafana/otel-lgtm/tags
#   postgres-exporter: https://quay.io/repository/prometheuscommunity/postgres-exporter?tab=tags
#   litellm:         https://github.com/BerriAI/litellm/pkgs/container/litellm-database
#   clickhouse:      https://hub.docker.com/r/clickhouse/clickhouse-server/tags
#   redis:           https://hub.docker.com/_/redis/tags
#   minio:           https://hub.docker.com/r/minio/minio/tags
#   langfuse:        https://github.com/langfuse/langfuse/pkgs/container/langfuse
#   mcpo:            https://github.com/open-webui/mcpo/pkgs/container/mcpo
# ===========================================
services:
  postgres:
    image: postgres:16.9
    container_name: owui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-openwebui}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-openwebui}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.23.2}
    container_name: owui-ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - owui-network
    ports:
    - "127.0.0.1:11434:11434" # Expose Ollama API port for VS Code (localhost only)

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:${LLAMA_SWAP_DOCKER_TAG:-unified-cuda-2026-05-19}
    container_name: owui-llamacpp
    restart: unless-stopped
    volumes:
      - llama-models:/models
      - ./config/llama-swap.yaml:/etc/llama-swap/config/config.yaml:ro
    command: --config /etc/llama-swap/config/config.yaml --listen :8080
    deploy:
      resources:
        limits:
          memory: 24G
          cpus: '4'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - owui-network

  grafana:
    image: grafana/otel-lgtm:0.27.1
    container_name: owui-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI (localhost only)
      # Ports 4317 (OTLP/gRPC) and 4318 (OTLP/HTTP) are internal — no external exposure needed
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    volumes:
      - grafana-data:/data
      # Extends the bundled LGTM Prometheus config with infrastructure scrapes.
      - ./config/lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    networks:
      - owui-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: owui-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_URI=postgres:5432/${DATABASE_NAME:-openwebui}?sslmode=disable
      - DATA_SOURCE_USER=${DATABASE_USER:-postgres}
      - DATA_SOURCE_PASS=${DATABASE_PASSWORD}
    volumes:
      - ./config/postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    command:
      - --config.file=/etc/postgres_exporter.yml
      - --collector.long_running_transactions
      - --collector.postmaster
      - --collector.process_idle
    ports:
      - "127.0.0.1:9187:9187"   # PostgreSQL exporter metrics (localhost only)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - owui-network

  litellm:
    # LLM gateway / OpenAI-compatible proxy fronting Azure Foundry, OpenAI,
    # Ollama, and llama-swap. UI + spend logs require the -database variant.
    image: ghcr.io/berriai/litellm-database:v1.85.1
    container_name: owui-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      grafana:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
      # Custom callback module referenced as `litellm_callbacks.owui_session_logger`
      # in litellm-config.yaml -> maps OWUI session headers to Langfuse sessions/users
      - ./config/litellm-callbacks.py:/app/litellm_callbacks.py:ro
    environment:
      # Core
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=true

      # Provider credentials (referenced from litellm-config.yaml via os.environ/*)
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Telemetry — Berri analytics off, OTEL on -> Grafana LGTM
      - LITELLM_TELEMETRY=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=litellm
      - OTEL_TRACES_EXPORTER=otlp

      # Langfuse traces (Phase 3) — keys generated in Langfuse UI on first login
      # at http://localhost:3030 -> Project Settings -> API Keys. Paste into .env.
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"   # localhost only; internal services use http://litellm:4000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2'
    networks:
      - owui-network

  # ===========================================================================
  # Langfuse v3 stack — LLM observability / evals (Phase 3)
  # Architecture: web + worker + clickhouse + redis + minio (shared postgres)
  # Docs: https://langfuse.com/self-hosting/docker-compose
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: owui-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    networks:
      - owui-network

  redis:
    image: redis:7.4-alpine
    container_name: owui-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1'
    networks:
      - owui-network

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: owui-minio
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console (localhost only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    networks:
      - owui-network

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: owui-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: owui-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0     # bind Next.js to all interfaces (default binds to eth0 IP only; breaks 127.0.0.1 healthcheck)
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3030}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: gillson
      LANGFUSE_INIT_ORG_NAME: Gillson
    ports:
      - "127.0.0.1:3030:3000"   # Langfuse UI (localhost only; expose via Cloudflare in Phase 4)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  open-webui:
    image: ghcr.io/jlgill/gillson-open-webui:v0.9.5
    container_name: owui-app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      grafana:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - owui-data:/app/backend/data
    environment:
      # Database — decomposed instead of DATABASE_URL with embedded password
      - DATABASE_TYPE=postgresql
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-openwebui}
      
      # Security — secret key read from file
      - WEBUI_SECRET_KEY_FILE=/run/secrets/webui_secret_key
      - WEBUI_AUTH=true
      - WEBUI_SESSION_COOKIE_SECURE=true
      
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      
      # OpenAI-compatible APIs → LiteLLM gateway (single entry point for all providers)
      # NOTE: OWUI persists OpenAI connections in the `config` table; these env vars
      # only apply on a fresh boot with no DB config. The actual runtime config was
      # set via SQL in Phase 2 cutover (see openwebui_config_backup_*_pre-litellm.json
      # for the prior state).
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}

      # Forward X-OpenWebUI-Chat-Id / -User-Id / -User-Email headers to LiteLLM
      # so the litellm_callbacks.owui_session_logger callback can populate
      # Langfuse session_id + trace_user_id (Sessions/Users views in Langfuse UI).
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      
      # Telemetry off
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      
      # Observability (OpenTelemetry → Grafana LGTM)
      - ENABLE_OTEL=true
      - ENABLE_OTEL_TRACES=true
      - ENABLE_OTEL_METRICS=true
      - ENABLE_OTEL_LOGS=true
      - OTEL_EXPORTER_OTLP_INSECURE=true  # Internal Docker network — no TLS needed
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317
      - OTEL_SERVICE_NAME=open-webui
      
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
    secrets:
      - webui_secret_key
    networks:
      - owui-network

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.11.34
    container_name: owui-terminal
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY_FILE=/run/secrets/open_terminal_api_key
      - OPEN_TERMINAL_MULTI_USER=true
    volumes:
      - open-terminal:/data
      - open-terminal-home:/home
    secrets:
      - open_terminal_api_key
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
    networks:
      - owui-network

  mcpo:
    # MCP-to-OpenAPI proxy. Fronts remote MCP servers (e.g. ClickUp) so OWUI
    # can register them via Admin -> Settings -> Tools as OpenAPI tool servers.
    # OAuth tokens persist in the mcpo_tokens volume; first-run requires the
    # 3035 callback port (see UPGRADE_GUIDE / repo memory mcp-integration).
    # NOTE: mcpo doesn't publish semver image tags - only `latest`, `main`,
    # `dev`, and `git-<sha>`. Upstream v0.0.20 (sha 788ff92) crashes parsing
    # ClickUp's tool schemas (AssertionError in _process_schema_property,
    # upstream issues #117/#244/#296). We build locally from a fork that
    # applies PR #279 plus a #296 list-valued-items guard. See
    # e:\Github\mcpo (branch clickup-schema-fix). Rebuild with:
    #   cd e:\Github\mcpo; docker build -t mcpo:v0.0.20-clickup-fix .
    image: mcpo:v0.0.20-clickup-fix
    container_name: owui-mcpo
    restart: unless-stopped
    # mcpo only supports --api-key (no --api-key-file). Read the docker secret
    # at startup and pass it inline so the value never lands in `docker inspect`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec mcpo --port 8000 --api-key "$$(tr -d "\r\n" < /run/secrets/mcpo_api_key)" --config /config/mcpo-config.json --hot-reload'
    secrets:
      - mcpo_api_key
    volumes:
      - ./config/mcpo-config.json:/config/mcpo-config.json:ro
      - mcpo-tokens:/root/.mcpo
    ports:
      # OpenAPI surface for host-side curl/debug (OWUI reaches mcpo via owui-network)
      - "127.0.0.1:8800:8000"
      # OAuth callback port - required ONLY during first-time auth ceremony.
      # Safe to leave bound to loopback; never exposed via cloudflared.
      # 3030 is already taken by langfuse-web on the host, so we use 3035.
      - "127.0.0.1:3035:3035"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - owui-network

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: owui-cloudflared
    restart: unless-stopped
    command: tunnel --protocol http2 run  # http2 required due to QUIC/UDP buffer issues in Docker
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      - open-webui
    networks:
      - owui-network

secrets:
  webui_secret_key:
    file: ./secrets/webui_secret_key.txt
  open_terminal_api_key:
    file: ./secrets/open_terminal_api_key.txt
  mcpo_api_key:
    file: ./secrets/mcpo_api_key.txt

volumes:
  postgres-data:
  ollama:
  llama-models:
  owui-data:
  open-terminal:
  open-terminal-home:
  grafana-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  mcpo-tokens:

networks:
  owui-network:
    driver: bridge

