# ===========================================
# Image Version Pinning
# ===========================================
# When upgrading, update the tags below and test thoroughly.
# Check for new versions at:
#   postgres:        https://hub.docker.com/_/postgres/tags
#   ollama:          https://hub.docker.com/ollama/ollama/tags
#   llama-swap:      https://github.com/mostlygeek/llama-swap/pkgs/container/llama-swap
#   open-webui:      https://github.com/jlgill/gillson-open-webui/pkgs/container/gillson-open-webui
#   open-terminal:   https://github.com/open-webui/open-terminal/pkgs/container/open-terminal
#   cloudflared:     https://hub.docker.com/r/cloudflare/cloudflared/tags
#   grafana-lgtm:    https://hub.docker.com/r/grafana/otel-lgtm/tags
#   postgres-exporter: https://quay.io/repository/prometheuscommunity/postgres-exporter?tab=tags
#   litellm:         https://github.com/BerriAI/litellm/pkgs/container/litellm-database
#   clickhouse:      https://hub.docker.com/r/clickhouse/clickhouse-server/tags
#   redis:           https://hub.docker.com/_/redis/tags
#   minio:           https://hub.docker.com/r/minio/minio/tags
#   langfuse:        https://github.com/langfuse/langfuse/pkgs/container/langfuse
#   mcpo:            https://github.com/open-webui/mcpo/pkgs/container/mcpo
#   playwright-mcp:  https://github.com/microsoft/playwright-mcp/releases (+ https://mcr.microsoft.com/playwright/tags)
# ===========================================
services:
  postgres:
    image: postgres:16.15
    container_name: owui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-openwebui}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-openwebui}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.40.5}
    container_name: owui-ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - owui-network
    ports:
    - "127.0.0.1:11434:11434" # Expose Ollama API port for VS Code (localhost only)

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:${LLAMA_SWAP_DOCKER_TAG:-unified-cuda-2026-08-15}
    container_name: owui-llamacpp
    restart: unless-stopped
    volumes:
      - llama-models:/models
      - ./config/llama-swap.yaml:/etc/llama-swap/config/config.yaml:ro
    command: --config /etc/llama-swap/config/config.yaml --listen :8080
    deploy:
      resources:
        limits:
          memory: 24G
          cpus: '4'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - owui-network

  grafana:
    image: grafana/otel-lgtm:0.36.0
    container_name: owui-grafana
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/grafana-prod-entrypoint.sh"]
    command: ["/otel-lgtm/run-all.sh"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - ENABLE_LOGS_TEMPO=true
      - ENABLE_LOGS_LOKI=true
      - ENABLE_LOGS_PYROSCOPE=true
      - ENABLE_LOGS_PROMETHEUS=true
      - PROMETHEUS_EXTRA_ARGS=--storage.tsdb.retention.time=14d
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://grafana.gillson.us/
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_AUTH_OAUTH_AUTO_LOGIN=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_AZUREAD_NAME=Microsoft Entra ID
      - GF_AUTH_AZUREAD_ENABLED=true
      - GF_AUTH_AZUREAD_ALLOW_SIGN_UP=true
      - GF_AUTH_AZUREAD_AUTO_LOGIN=false
      - GF_AUTH_AZUREAD_CLIENT_AUTHENTICATION=client_secret_post
      - GF_AUTH_AZUREAD_CLIENT_ID=020c3e3a-e52c-476a-90f9-45413fbe3276
      - GF_AUTH_AZUREAD_SCOPES=openid email profile
      - GF_AUTH_AZUREAD_AUTH_URL=https://login.microsoftonline.com/1b4ec955-c987-44c3-a62f-d1cd054d1ddc/oauth2/v2.0/authorize
      - GF_AUTH_AZUREAD_TOKEN_URL=https://login.microsoftonline.com/1b4ec955-c987-44c3-a62f-d1cd054d1ddc/oauth2/v2.0/token
      - GF_AUTH_AZUREAD_ALLOWED_ORGANIZATIONS=1b4ec955-c987-44c3-a62f-d1cd054d1ddc
      - GF_AUTH_AZUREAD_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_AZUREAD_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_AZUREAD_SKIP_ORG_ROLE_SYNC=false
      - GF_AUTH_AZUREAD_FORCE_USE_GRAPH_API=false
      - GF_AUTH_AZUREAD_USE_PKCE=true
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI (localhost only)
      # Ports 4317 (OTLP/gRPC) and 4318 (OTLP/HTTP) are internal — no external exposure needed
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    volumes:
      - grafana-data:/data
      # Extends the bundled LGTM Prometheus config with infrastructure scrapes.
      - ./config/lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./config/lgtm/tempo.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./config/lgtm/loki.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./config/lgtm/pyroscope.yaml:/otel-lgtm/pyroscope-config.yaml:ro
      - ./scripts/grafana-prod-entrypoint.sh:/app/grafana-prod-entrypoint.sh:ro
    secrets:
      - grafana_oauth_client_secret
    networks:
      - owui-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: owui-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_URI=postgres:5432/${DATABASE_NAME:-openwebui}?sslmode=disable
      - DATA_SOURCE_USER=${DATABASE_USER:-postgres}
      - DATA_SOURCE_PASS=${DATABASE_PASSWORD}
    volumes:
      - ./config/postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    command:
      - --config.file=/etc/postgres_exporter.yml
      - --collector.long_running_transactions
      - --collector.postmaster
      - --collector.process_idle
    ports:
      - "127.0.0.1:9187:9187"   # PostgreSQL exporter metrics (localhost only)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - owui-network

  litellm:
    # LLM gateway / OpenAI-compatible proxy fronting Azure Foundry, OpenAI,
    # Ollama, and llama-swap. UI + spend logs require the -database variant.
    image: ghcr.io/berriai/litellm-database:v1.100.1
    container_name: owui-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      grafana:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/litellm-oauth-entrypoint.sh"]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
      - ./config/litellm-callbacks.py:/app/litellm_callbacks.py:ro
      - ./scripts/litellm-prod-entrypoint.sh:/app/litellm-oauth-entrypoint.sh:ro
    secrets:
      - litellm_oauth_client_secret
    environment:
      # Core
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - MICROSOFT_CLIENT_ID=abb637de-25d6-45d0-ae32-1da3682480c2
      - MICROSOFT_TENANT=1b4ec955-c987-44c3-a62f-d1cd054d1ddc
      - PROXY_BASE_URL=https://litellm.gillson.us
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/litellm
      - STORE_MODEL_IN_DB=true

      # Redis — shared owui-redis instance (also used by Langfuse). Backs the
      # coordination client: cross-worker rate limits, budgets, spend buffer,
      # pod lock and config-change invalidation across --num_workers 2.
      # router_settings in litellm-config.yaml reads these same vars.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_AUTH}

      # Provider credentials (referenced from litellm-config.yaml via os.environ/*)
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Telemetry — Berri analytics off, OTEL on -> Grafana LGTM
      - LITELLM_TELEMETRY=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=litellm
      - OTEL_TRACES_EXPORTER=otlp

      # Langfuse — OWUI chat project used by the correlator.
      - LANGFUSE_HOST=http://langfuse-web:3000
      - OWUI_LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - OWUI_LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}

      - OWUI_TRACE_CORRELATOR_DEBUG=${OWUI_TRACE_CORRELATOR_DEBUG:-false}
    ports:
      - "127.0.0.1:4000:4000"   # localhost only; internal services use http://litellm:4000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    networks:
      - owui-network

  # ===========================================================================
  # Langfuse v3 stack — LLM observability / evals (Phase 3)
  # Architecture: web + worker + clickhouse + redis + minio (shared postgres)
  # Docs: https://langfuse.com/self-hosting/docker-compose
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:25.12.11.4
    container_name: owui-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    networks:
      - owui-network

  redis:
    image: redis:7.4.11-alpine
    container_name: owui-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1'
    networks:
      - owui-network

  minio:
    # NOTE: MinIO archived its GitHub repo (Apr 2026) and removed all pre-built
    # Docker images from Docker Hub. This tag is only available via local cache.
    # CVE RELEASE.2025-10-15T17-29-55Z (GHSA-jjjj-jwhf-8rgr, privilege escalation)
    # exists but has no published image — would need building from source.
    # TODO: Review whether MinIO is needed at all — Langfuse uses it for S3
    # event/media storage, but we don't use S3-compatible storage for OWUI.
    # Evaluate during Langfuse v4 upgrade whether MinIO can be dropped entirely.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: owui-minio
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console (localhost only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    networks:
      - owui-network

  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.11
    container_name: owui-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  langfuse-web:
    image: langfuse/langfuse:3.225.11
    container_name: owui-langfuse
    restart: unless-stopped
    entrypoint: ["dumb-init", "--", "/bin/sh", "/app/langfuse-prod-entrypoint.sh"]
    command:
      - /bin/sh
      - -c
      - >-
        if [ -n "$$NEXT_PUBLIC_LANGFUSE_CLOUD_REGION" ]; then
          node --import dd-trace/initialize.mjs ./web/server.js --keepAliveTimeout 110000;
        else
          node ./web/server.js --keepAliveTimeout 110000;
        fi
    depends_on:
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0     # bind Next.js to all interfaces (default binds to eth0 IP only; breaks 127.0.0.1 healthcheck)
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3030}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      AUTH_AZURE_AD_CLIENT_ID: 5f1c6a02-e5d3-499b-8d8c-a93a3ef94b1c
      AUTH_AZURE_AD_TENANT_ID: 1b4ec955-c987-44c3-a62f-d1cd054d1ddc
      AUTH_AZURE_AD_ALLOW_ACCOUNT_LINKING: "true"
      NODE_OPTIONS: --require=/app/langfuse-prod-ipv4.cjs
      LANGFUSE_INIT_ORG_ID: gillson
      LANGFUSE_INIT_ORG_NAME: Gillson
    volumes:
      - ./scripts/langfuse-prod-entrypoint.sh:/app/langfuse-prod-entrypoint.sh:ro
      - ./scripts/oauth-pilot/node-ipv4.cjs:/app/langfuse-prod-ipv4.cjs:ro
    secrets:
      - langfuse_oauth_client_secret
    ports:
      - "127.0.0.1:3030:3000"   # Langfuse UI (localhost only; expose via Cloudflare in Phase 4)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  open-webui:
    image: ghcr.io/jlgill/gillson-open-webui:90ad3d0
    container_name: owui-app
    entrypoint: ["/bin/sh", "/app/owui-oauth-entrypoint.sh"]
    command: ["bash", "start.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      grafana:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - owui-data:/app/backend/data
      - ./scripts/owui-prod-entrypoint.sh:/app/owui-oauth-entrypoint.sh:ro
    environment:
      # Database — decomposed instead of DATABASE_URL with embedded password
      - DATABASE_TYPE=postgresql
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-openwebui}
      
      # Security — secret key read from file
      - WEBUI_SECRET_KEY_FILE=/run/secrets/webui_secret_key
      - WEBUI_AUTH=true
      - WEBUI_SESSION_COOKIE_SECURE=true

      - WEBUI_URL=https://owui.gillson.us
      - ENABLE_OAUTH=true
      - ENABLE_OAUTH_PERSISTENT_CONFIG=false
      - ENABLE_OAUTH_SIGNUP=false
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_AUTO_REDIRECT=false
      - ENABLE_OAUTH_ROLE_MANAGEMENT=false
      - ENABLE_OAUTH_GROUP_MANAGEMENT=false
      - OAUTH_ALLOWED_DOMAINS=gillson.me
      - MICROSOFT_CLIENT_ID=26313121-1f1d-4263-846f-90e5385adab3
      - MICROSOFT_CLIENT_TENANT_ID=1b4ec955-c987-44c3-a62f-d1cd054d1ddc
      - MICROSOFT_REDIRECT_URI=https://owui.gillson.us/oauth/microsoft/callback
      
      #OWUI Configuration
      - ENABLE_KB_EXEC=True
      - RAG_SYSTEM_CONTEXT=True
      # Cap native tool-call iterations per response (upstream default 256; parallel
      # calls in one turn count as one iteration). Applies on next container recreate.
      - CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=40

      # Performance
      - ENABLE_ORJSON=true
      - UVICORN_WS_PER_MESSAGE_DEFLATE=false

      # Retrieval
      - ENABLE_RAG_CSV_SUMMARY=true

      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      
      # OpenAI-compatible APIs → LiteLLM gateway (single entry point for all providers)
      # NOTE: OWUI persists OpenAI connections in the `config` table; these env vars
      # only apply on a fresh boot with no DB config. The actual runtime config was
      # set via SQL in Phase 2 cutover (see openwebui_config_backup_*_pre-litellm.json
      # for the prior state).
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}

      # Forward X-OpenWebUI-User-Id / -User-Email headers to downstream services.
      # (Langfuse session/user attribution now comes from the OWUI request body
      # metadata via the Langfuse filter pipeline, not these headers.)
      - ENABLE_FORWARD_USER_INFO_HEADERS=true

      # Telemetry off
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      
      # Observability (OpenTelemetry → Grafana LGTM)
      - ENABLE_OTEL=true
      - ENABLE_OTEL_TRACES=true
      - ENABLE_OTEL_METRICS=true
      - ENABLE_OTEL_LOGS=true
      - OTEL_EXPORTER_OTLP_INSECURE=true  # Internal Docker network — no TLS needed
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana:4317
      - OTEL_SERVICE_NAME=open-webui
      
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '4'
    secrets:
      - webui_secret_key
      - owui_oauth_client_secret
    networks:
      - owui-network
      - outline-net

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.14.0
    container_name: owui-terminal
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY_FILE=/run/secrets/open_terminal_api_key
      - OPEN_TERMINAL_MULTI_USER=true
      # Morning Standup automation: scripts/morning-standup/fetch_clickup_standup.py
      # pulls ClickUp tasks via mcpo (or the REST API when a token is present) so no
      # task payload ever passes through the LLM.
      - MCPO_URL=http://owui-mcpo:8000/clickup
      - MCPO_API_KEY_FILE=/run/secrets/mcpo_api_key
      # Optional: put a ClickUp personal token in ./secrets/clickup_api_token.txt,
      # declare it under top-level secrets: and in this service, then enable:
      # - CLICKUP_API_TOKEN_FILE=/run/secrets/clickup_api_token
    volumes:
      - open-terminal:/data
      - open-terminal-home:/home
      - ./scripts/morning-standup:/opt/morning-standup:ro
    secrets:
      - open_terminal_api_key
      - mcpo_api_key
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    networks:
      - owui-network

  mcpo:
    # MCP-to-OpenAPI proxy. Fronts remote MCP servers (e.g. ClickUp) so OWUI
    # can register them via Admin -> Settings -> Tools as OpenAPI tool servers.
    # OAuth tokens persist in the mcpo_tokens volume; first-run requires the
    # 3035 callback port (see UPGRADE_GUIDE / repo memory mcp-integration).
    # NOTE: mcpo doesn't publish semver image tags - only `latest`, `main`,
    # `dev`, and `git-<sha>`. Upstream v0.0.20 (sha 788ff92) crashes parsing
    # ClickUp's tool schemas (AssertionError in _process_schema_property,
    # upstream issues #117/#244/#296). We build locally from a fork that
    # applies PR #279 plus a #296 list-valued-items guard. See
    # e:\Github\mcpo (branch clickup-schema-fix). Rebuild with:
    #   cd e:\Github\mcpo; docker build -t mcpo:v0.0.20-clickup-fix .
    image: mcpo:v0.0.20-clickup-fix
    container_name: owui-mcpo
    restart: unless-stopped
    # mcpo only supports --api-key (no --api-key-file). Read the docker secret
    # at startup and pass it inline so the value never lands in `docker inspect`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec mcpo --port 8000 --api-key "$$(tr -d "\r\n" < /run/secrets/mcpo_api_key)" --config /config/mcpo-config.json --hot-reload'
    secrets:
      - mcpo_api_key
    volumes:
      - ./config/mcpo-config.json:/config/mcpo-config.json:ro
      - mcpo-tokens:/root/.mcpo
    ports:
      # OpenAPI surface for host-side curl/debug (OWUI reaches mcpo via owui-network)
      - "127.0.0.1:8800:8000"
      # OAuth callback port - required ONLY during first-time auth ceremony.
      # Safe to leave bound to loopback; never exposed via cloudflared.
      # 3030 is already taken by langfuse-web on the host, so we use 3035.
      - "127.0.0.1:3035:3035"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - owui-network

  playwright-mcp:
    # Playwright MCP server — exposes browser automation tools (navigate, click,
    # fill, snapshot) as MCP tools. OWUI connects DIRECTLY via native MCP
    # (Streamable HTTP, supported since v0.6.31) — NOT proxied through mcpo.
    # Register in OWUI: Admin → External Tools → + → Type: MCP (Streamable HTTP)
    #   URL: http://playwright-mcp:8931/mcp, Auth: None
    # DISTINCT from docker-compose.playwright.yaml web-loader (playwright
    # run-server WS:3000 for RAG). This runs @playwright/mcp HTTP/SSE:8931 for
    # tool calls. Different npm package, different protocol, different port.
    # Login persistence: --user-data-dir + named volume keeps cookies/logins
    # across restarts. Required for job-site auth (LinkedIn, Greenhouse, etc.).
    image: mcr.microsoft.com/playwright:v1.62.0-noble # Must match requirements.txt
    container_name: owui-playwright-mcp
    restart: unless-stopped
    # @playwright/mcp pinned to v0.0.78 which bundles Playwright 1.62.0-alpha,
    # matching the v1.62.0-noble image's pre-installed browsers. Bump both
    # together when upgrading: image tag + @playwright/mcp version + requirements.txt.
    # --executable-path points to the bundled Chromium (not Chrome channel).
    # NOTE: update the chromium-NNNN path if the image's browser version changes.
    # --caps vision adds screenshot/coordinate-based tools (browser_screen_*) on top
    # of the default a11y-snapshot tools. Needed for job sites that obfuscate their
    # DOM to break automation (LinkedIn/Workday) where the a11y tree is insufficient.
    # Trade-off: screenshots consume image tokens — only used when snapshot tools fail.
    command: >-
      npx -y @playwright/mcp@0.0.78
      --port 8931 --host 0.0.0.0 --headless
      --allowed-hosts '*'
      --caps vision
      --executable-path /ms-playwright/chromium-1234/chrome-linux64/chrome
      --user-data-dir /root/.playwright-mcp
    volumes:
      - playwright-mcp-profile:/root/.playwright-mcp
    ports:
      # Internal-only — mcpo reaches via owui-network DNS. Host mapping for debugging.
      - "127.0.0.1:8931:8931"
    healthcheck:
      # /mcp returns HTTP 400 on bare GET (correct — needs protocol headers).
      # /sse hangs curl (SSE is a streaming connection). Without -f, curl exits 0
      # on any HTTP response incl. 400. --max-time 5 prevents hang if server stalls.
      test: ["CMD-SHELL", "curl -s --max-time 5 -o /dev/null http://localhost:8931/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  # Playwright run-server — exposes the raw browser over WebSocket (CDP-over-WS)
  # for OWUI's WEB_LOADER_ENGINE=playwright (RAG document fetching). DISTINCT
  # from playwright-mcp above: different npm package (`playwright` vs
  # `@playwright/mcp`), different protocol (WS CDP vs MCP JSON-RPC), different
  # port (3000 vs 8931), different purpose (RAG ingestion vs agentic tools).
  # SafePlaywrightURLLoader in retrieval/web/utils.py connects via
  # p.chromium.connect(ws://playwright:3000) — must speak the Playwright WS
  # protocol, NOT MCP. Image tag MUST match the playwright Python pkg version
  # installed in the owui-app image (currently 1.62.0).
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    container_name: owui-playwright-loader
    restart: unless-stopped
    command: npx -y playwright@1.62.0 run-server --port 3000 --host 0.0.0.0
    # No host port mapping: Grafana already binds 127.0.0.1:3000. owui-app
    # reaches this via owui-network DNS as ws://playwright:3000.
    healthcheck:
      # run-server responds on the WS endpoint; a bare HTTP GET returns 400
      # (missing WS upgrade headers) which is the healthy signal. Without -f,
      # curl exits 0 on any HTTP response incl. 400.
      test: ["CMD-SHELL", "curl -s --max-time 5 -o /dev/null http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - owui-network

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: owui-cloudflared
    restart: unless-stopped
    command: tunnel --protocol http2 run  # http2 required due to QUIC/UDP buffer issues in Docker
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      - open-webui
    networks:
      - owui-network

secrets:
  webui_secret_key:
    file: ./secrets/webui_secret_key.txt
  open_terminal_api_key:
    file: ./secrets/open_terminal_api_key.txt
  mcpo_api_key:
    file: ./secrets/mcpo_api_key.txt
  litellm_oauth_client_secret:
    file: ./secrets/litellm_oauth_client_secret.txt
  grafana_oauth_client_secret:
    file: ./secrets/grafana_oauth_client_secret.txt
  langfuse_oauth_client_secret:
    file: ./secrets/langfuse_oauth_client_secret.txt
  owui_oauth_client_secret:
    file: ./secrets/owui_oauth_client_secret.txt


volumes:
  postgres-data:
  ollama:
  llama-models:
  owui-data:
  open-terminal:
  open-terminal-home:
  grafana-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  mcpo-tokens:
  playwright-mcp-profile:

networks:
  owui-network:
    driver: bridge
  outline-net:
    name: outline_default
    external: true

